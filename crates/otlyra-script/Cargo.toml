[package]
name = "otlyra-script"
description = "Otlyra's script engine seam: one Otter isolate per page, and the rules it runs under."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
# The JavaScript engine, by revision. A git dependency rather than a path one so
# that a clone of this repository alone builds: Otter is ours and is changed
# alongside the browser, but a checkout of it beside this one is a fact about a
# workstation, not about the project.
#
# Working on both at once is what the `[patch]` at the root of the workspace is
# for — it points these at `../otter` when it is there. Bump the `rev` when a
# change lands in Otter that the browser needs.
#
# `otter-runtime` is the entry point its own AGENTS.md names; `otter-vm` is
# reached only through what that crate re-exports.
otter-runtime = { git = "https://github.com/octofhir/otter", rev = "800a830ac4bb3924fb932556b77c095a834271e2" }
# The declarative binding layer. Every path its macros generate is
# `::otter_vm::…`, which is why the crate root aliases `otter_runtime` to that
# name — see the `extern crate` in `lib.rs`.
otter-macros = { git = "https://github.com/octofhir/otter", rev = "800a830ac4bb3924fb932556b77c095a834271e2" }
# Named because the generated binding glue reaches for it by name at the crate
# root. It is already in the graph through the runtime, so this costs no
# package.
otter-gc = { git = "https://github.com/octofhir/otter", rev = "800a830ac4bb3924fb932556b77c095a834271e2" }
# The web platform Otter already implements: `URL`, `Event`, `performance`,
# `TextEncoder`, `structuredClone`, `crypto`, `fetch`. Reimplementing any of it
# here would be duplication; what a browser has to write itself is the part
# that knows about a document, which is this crate.
otter-web = { git = "https://github.com/octofhir/otter", rev = "800a830ac4bb3924fb932556b77c095a834271e2" }

# The document the scripts will reach into at M13, and the parser's script
# point they are called from. Neither depends on this crate: the parser knows
# when a script runs and nothing about how, which is what `ScriptRunner` is.
otlyra-dom.workspace = true
otlyra-html.workspace = true
# Selector matching, for `querySelector`. The engine is written once, in the
# crate the cascade already uses it from.
otlyra-css.workspace = true

html5ever.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true
