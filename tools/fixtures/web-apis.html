<!doctype html>
<meta charset="utf-8">
<title>web APIs</title>
<!-- Served over HTTP by tools/bidi-smoke.py, which calls these functions
     through script.evaluate and compares what they answer. -->
<img id="picture" src="pixel.png" width="2" height="2">
<canvas id="canvas" width="64" height="32"></canvas>
<script>
// Draws, then reads back: a rectangle, a path through a transform, text, and
// the picture above drawn into the bitmap.
function canvasCheck() {
  const ctx = document.getElementById('canvas').getContext('2d');
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(0, 0, 8, 8);
  ctx.save();
  ctx.translate(16, 0);
  ctx.beginPath();
  ctx.arc(4, 4, 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgb(0, 0, 255)';
  ctx.fill();
  ctx.restore();
  ctx.drawImage(document.getElementById('picture'), 32, 0, 8, 8);
  const at = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data).join(',');
  return [at(4, 4), at(20, 4), at(36, 4), at(60, 30), ctx.measureText('Wide').width > 10].join(' ');
}

// Starts a worker, posts it a value with a cycle in it, and keeps what the
// worker said back in `workerAnswer`: through structured clone both ways,
// `importScripts` and `fetch` through the page. The answer comes turns later,
// so the driver polls for it.
let workerAnswer = '';
function workerCheck() {
  new Promise((resolve) => {
    const worker = new Worker('web-apis-worker.js');
    worker.onmessage = (event) => { resolve(event.data); worker.terminate(); };
    worker.onerror = (event) => resolve('error: ' + event.message);
    const message = { when: new Date(0), bytes: new Uint8Array([1, 2]) };
    message.self = message;
    worker.postMessage(message);
  }).then((answer) => { workerAnswer = answer; });
  return 'started';
}

// A WebSocket to the smoke's echo endpoint and an event stream from its
// events endpoint; what each reported in `socketAnswer` (the two interleave).
const socketAnswer = [];
function socketCheck() {
  const socket = new WebSocket(`ws://${location.host}/ws`, ['chat']);
  socket.onopen = () => { socketAnswer.push('open:' + socket.protocol); socket.send('hello'); };
  socket.onmessage = (event) => { socketAnswer.push(event.data); socket.close(1000, 'done'); };
  socket.onclose = (event) => socketAnswer.push(`close:${event.code}:${event.wasClean}`);
  const source = new EventSource('/events');
  source.onopen = () => socketAnswer.push('es-open');
  source.onmessage = (event) => socketAnswer.push('message:' + event.data);
  source.addEventListener('tick', (event) => { socketAnswer.push(`tick:${event.data}:${event.lastEventId}`); source.close(); });
  return 'started';
}
</script>
